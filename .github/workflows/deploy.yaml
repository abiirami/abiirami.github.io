name: Deploy Vite React App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Check LFS assets before build
        run: |
          echo "=== Git LFS files ==="
          git lfs ls-files

          echo ""
          echo "=== Public folder ==="
          ls -lah public

          echo ""
          echo "=== Public art folder ==="
          ls -lah public/art || true


      - name: Install dependencies
        run: npm install


      - name: Build app
        run: npm run build


      - name: Check build output
        run: |
          echo "=== Dist folder ==="
          ls -lah dist

          echo ""
          echo "=== Dist art folder ==="
          ls -lah dist/art || true


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist



  deploy:

    needs: build

    runs-on: ubuntu-latest


    environment:

      name: github-pages


    steps:

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4