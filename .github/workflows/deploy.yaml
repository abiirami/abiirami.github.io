name: Deploy Vite React App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          lfs: true


      - uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Check LFS assets
        run: |
          git lfs ls-files
          ls -lh public/art


      - run: npm install


      - run: npm run build


      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist



  deploy:

    needs: build

    runs-on: ubuntu-latest


    environment:

      name: github-pages


    steps:

      - uses: actions/deploy-pages@v4